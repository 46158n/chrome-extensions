<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL Memo Line</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1>URL Memo Line</h1>
        <button id="openOptions" class="icon-button" type="button" title="登録済みドメイン一覧">一覧</button>
      </header>

      <p id="url" class="url"></p>
      <p id="status" class="status" aria-live="polite"></p>

      <label class="field">
        <span>メモ</span>
        <input id="memo" type="text" maxlength="160" autocomplete="off" placeholder="このドメイン用の1行メモ">
        <div class="memo-actions">
          <button id="fetchH1" class="icon-button" type="button" title="開いているページのh1をメモに反映">H1取得</button>
          <button id="clearMemo" class="icon-button" type="button" title="メモの内容をクリア">クリア</button>
          <button id="copyMemo" class="icon-button" type="button" title="メモの内容をコピー">コピー</button>
        </div>
      </label>

      <div class="actions">
        <button id="save" class="primary" type="button">登録 / 保存</button>
        <button id="remove" type="button">解除</button>
      </div>
    </main>

    <script src="storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
